services:
  kopia-server:
    container_name: kopia-server
    build: .
    restart: always
    ports:
      - "51515:51515"
    volumes:
      - ./data/repo:/repo
      - ./data/config:/app/config
      - ./data/cache:/app/cache
      - ./config.yml:/etc/backup/config.yml:ro
      - proxy_certs:/certs:ro
    env_file:
      - .env
    environment:
      - LETSENCRYPT_HOST=${KOPIA_VIRTUAL_HOST}
    networks:
      - proxy
      - default

volumes:
  proxy_certs:
    external: true
    name: proxy_certs

networks:
  proxy:
    external: true
    name: proxy
